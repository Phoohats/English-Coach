name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDSDK_CONFIG: /tmp/ecc-cloudsdk
      FIREBASE_PROJECT_ID: demo-english-career-coach
      FIREBASE_TOKEN: ""
      GCLOUD_PROJECT: demo-english-career-coach
      GOOGLE_APPLICATION_CREDENTIALS: ""
      GOOGLE_CLOUD_PROJECT: demo-english-career-coach
      XDG_CONFIG_HOME: /tmp/ecc-xdg
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Scan repository before dependency installation
        run: node scripts/scan-secrets.mjs

      - name: Check local-only policy before repository code
        run: node scripts/check-repository-policy.mjs

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts

      - name: Run all quality gates
        run: npm run verify

  firebase-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDSDK_CONFIG: /tmp/ecc-cloudsdk
      FIREBASE_PROJECT_ID: demo-english-career-coach
      FIREBASE_TOKEN: ""
      GCLOUD_PROJECT: demo-english-career-coach
      GOOGLE_APPLICATION_CREDENTIALS: ""
      GOOGLE_CLOUD_PROJECT: demo-english-career-coach
      XDG_CONFIG_HOME: /tmp/ecc-xdg
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Scan repository before dependency installation
        run: node scripts/scan-secrets.mjs

      - name: Check local-only policy before repository code
        run: node scripts/check-repository-policy.mjs

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install locked root dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned Node 22 runtime
        run: npm --prefix tools/node22 ci

      - name: Install locked Functions dependencies with Node 22
        run: npm run install:functions

      - name: Run Firebase emulator integration gate
        run: npm run test:firebase

      - name: Verify emulator failure propagation and teardown
        run: npm run test:firebase:lifecycle

      - name: Audit locked dependencies
        run: npm run audit:security

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDSDK_CONFIG: /tmp/ecc-cloudsdk
      FIREBASE_PROJECT_ID: demo-english-career-coach
      FIREBASE_TOKEN: ""
      GCLOUD_PROJECT: demo-english-career-coach
      GOOGLE_APPLICATION_CREDENTIALS: ""
      GOOGLE_CLOUD_PROJECT: demo-english-career-coach
      XDG_CONFIG_HOME: /tmp/ecc-xdg
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Scan repository before dependency review
        run: node scripts/scan-secrets.mjs

      - name: Check local-only policy before dependency review
        run: node scripts/check-repository-policy.mjs

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-ghsas: |
            GHSA-8988-4f7v-96qf

  verify:
    if: always()
    needs: [core-quality, firebase-emulator, dependency-review]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality gate
        env:
          CORE_RESULT: ${{ needs.core-quality.result }}
          DEPENDENCY_RESULT: ${{ needs.dependency-review.result }}
          EVENT_NAME: ${{ github.event_name }}
          FIREBASE_RESULT: ${{ needs.firebase-emulator.result }}
        run: |
          test "$CORE_RESULT" = "success"
          test "$FIREBASE_RESULT" = "success"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            test "$DEPENDENCY_RESULT" = "success"
          else
            test "$DEPENDENCY_RESULT" = "skipped"
          fi
